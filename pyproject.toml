[project]
name = "rb-yandex-direct"
# Version comes from the git tag vX.Y.Z (uv-dynamic-versioning) — never add `version =`.
dynamic = ["version"]
description = "Yandex Direct API v5: campaigns, ads, reports, plus the v4 Live and web interfaces."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roman Bolandau" }]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27,<0.29",
    "rich>=13.7",
    "pydantic>=2.6",
    "tomli-w>=1.0",
    "platformdirs>=4.2",
    "httpx>=0.27",
    "packaging>=24.0",
    "keyring>=25.0",
    "rb-yandex-oauth>=0.4,<0.5",  # на 0.x минорная версия ломающая
]

# Общая OAuth-авторизация Яндекса (keychain + env, автообновление токена) — из реестра Gitea.
# Правки одновременно с Директом: `uv pip install -e ../rb-yandex-oauth` в venv, без коммита.
# Браузерный слой direct-cli — с коммита main: в PyPI 0.5.2 ещё нет истории изменений
# (change_history), чтения UTM/счётчиков Мастера и BrowserNetworkError. Вернуть на PyPI,
# когда выйдет релиз с ними (0.5.3+): убрать строку и поднять нижнюю границу в extra.
direct-cli = { git = "https://github.com/axisrow/direct-cli", rev = "66c48ac5362ae572ca8b3544e84c6e8cc47059b4" }

[project.optional-dependencies]
# Веб-интерфейс Директа (Мастер кампаний, история изменений): браузерный слой direct-cli
# (MIT) — Playwright + куки Chrome. Внутренний модуль чужого пакета, поэтому узкий диапазон и
# закреплённый коммит (см. [tool.uv.sources]); обновлять вместе с живой проверкой `yd masters list`.
# После установки: `playwright install chromium`.
browser = ["direct-cli[browser]>=0.5.2,<0.6"]

[project.scripts]
yd = "rb_yandex_direct.cli:main"

[project.urls]
Repository = "https://github.com/bolandeu/yandex-direct"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.uv]
# Rebuild the editable install when a commit or tag moves, so `--version` follows the tag.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]


# Siblings resolve from disk: a version range in `dependencies` plus a `path` source, never an index.
[tool.uv.sources]
rb-yandex-oauth = { path = "../rb-yandex-oauth", editable = true }

[tool.hatch.build.targets.sdist]
# What a release must not carry: the agent's own files, the forge configs and the dev tooling. The wheel is
# narrow already (`packages = ["src/<pkg>"]`); this is about the sdist, which is otherwise a copy of the repo.
exclude = [
  "/.agents",
  "/.claude",
  "/.claude-plugin",
  "/.gitea",
  "/.github",
  "/docs",
  "/scripts",
  "/uv.lock",
  "/AGENTS.md",
  "/CLAUDE.md",
  "/CODING_STANDARDS.md",
  "/CONTEXT.md",
  "/.copier-answers.yml",
  "^\\.gitignore$",
  "/.gitleaks.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rb_yandex_direct"]

[tool.hatch.build.targets.wheel.force-include]
# The installed CLI reads [[tool.rb.external]] from here (core/deps.py).
"pyproject.toml" = "rb_yandex_direct/_pyproject.toml"

[dependency-groups]
# Mutation testing, run now and then and before big releases — not in the gate:
# `uv run --group mutation mutmut run`, then `mutmut results` / `mutmut browse`.
# Needs fork(): macOS/Linux (WSL on Windows). Settings: [tool.mutmut] below.
mutation = ["mutmut>=3.3"]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.0",
    "pyyaml>=6.0",  # .copier-answers.yml, the CI workflow, tests/contracts/*.yaml
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "syrupy>=4.8",
    "ty>=0.0.80",
]

# External (non-Python) dependencies — every CLI this tool runs (require_cli,
# shutil.which, subprocess with a literal program, npx). The gate checks this
# list against the code both ways; doctor and require_cli read it at runtime;
# the tools catalog reads it (the Standard, Technology).
# [[tool.rb.external]]
# name = "ffmpeg"
# required = true               # false: the tool works without it (doctor stays healthy)
# min_version = "6.0"           # optional
# check = "ffmpeg -version"     # prints the version; default "<name> --version"
# why = "transcodes the downloaded videos"
# detect = false                # run via an injected runner / absolute path the gate can't see
# dist = "rb-serp"              # for one of our CLIs: its distribution (default rb-<name>)
# url = "https://github.com/bolandeu/serp"  # its repo: DEPENDENCY_TOO_OLD then prints a pinned install

# Where sysadmin's tool-updater installs this tool after its first tag. The
# installation is sysadmin's; this section only says where. homeserver: users
# to install for (empty = build and publish only); mac: install on the Mac.
# extras (optional): the extras to install with, e.g. extras = ["browser"].
[tool.rb.install]
homeserver = ["rbtools"]
mac = true

[tool.cli-generator]
# Where scripts/check_command_docstrings.py (called by the project's checks)
# looks for commands: a glob or a list of globs, relative to the repo root.
commands = ["src/rb_yandex_direct/commands/*.py"]
# gate check (the gate): extras to install before ruff/ty/pytest.
# gate_extras = ["browser"]

[tool.pytest.ini_options]
# Only tests/: mutmut leaves a copy of the tree in mutants/.
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing:skip-covered"
# tests/test_help.py keeps help snapshots at tests/snapshots/help/<command>.txt
# (the Standard, Commands), not in syrupy's own `__snapshots__/<test file>/` layout, so
# syrupy warns it "can not relate" each file to its test. It can — by name.
filterwarnings = ["ignore:(?s).*Can not relate snapshot:UserWarning"]

[tool.mutmut]
source_paths = ["src/rb_yandex_direct"]
also_copy = ["scripts/", "pyproject.toml"]  # tests read them (test_scripts.py, the distribution checks)
pytest_add_cli_args = ["--no-cov"]  # fail_under would kill every mutant
# only_mutate = ["*/core/normalize.py"]  # one module at a time on a big tool

[tool.coverage.run]
source = ["src"]
# Python 3.14: the default sysmon core keeps a CodeInfo for every code object, and typer compiles
# the stringified annotations of every command on each CliRunner.invoke: ~4 MB per call, 3.5 GB in CI.
core = "ctrace"

[tool.coverage.report]
# The template ships at ~94%; keep the bar where it is instead of letting
# new commands land untested. Raise it, never lower it.
fail_under = 90
show_missing = true

[tool.ty.terminal]
# Only errors fail the gate; recent ty (>= 0.0.84) otherwise exits 1 on warnings too.
# Legacy code that can't be fixed yet: downgrade specific rules instead of
# ignoring them, e.g. [tool.ty.rules] possibly-unbound-attribute = "warn".
error-on-warning = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S", "T20", "TID251"]
# RUF001-003 — «похожие» unicode-символы: интерфейс на русском, кириллица и
# типографские тире здесь норма, а не опечатка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107", "T201", "TID251"]  # assert и фиктивные токены — суть тестов; print in code strings; httpx for mocks
"scripts/*" = ["S603", "S607", "T201", "TID251"]  # build_api_index.py fetches docs with httpx; subprocess with fixed argv lists (git, uv), no shell; scripts print to the console
"src/*/providers/*" = ["TID251"]    # external APIs live here

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"httpx".msg = "Call external APIs through providers/ (subclass providers.HttpProvider)."

[tool.ruff.lint.flake8-bugbear]
# Typer's `param: T = typer.Option(...)` style is a call in a default on purpose.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

# Legacy-код (dict из JSON API без моделей, «raw-dict подход»): эти правила пока
# предупреждения, а не ошибки. Новый код держим чистым; правило возвращать в error,
# когда предупреждений по нему не останется.
[tool.ty.rules]
invalid-argument-type = "warn"
invalid-assignment = "warn"
not-iterable = "warn"
