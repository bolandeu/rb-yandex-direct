[project]
name = "rb-yandex-direct"
# Версия — из git-тега vX.Y.Z (uv-dynamic-versioning); `version =` не добавлять.
dynamic = ["version"]
description = "Яндекс.Директ API v5: библиотека и CLI yd"
readme = "README.md"
authors = [{ name = "Roman Bolandau" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "loguru>=0.7",
    "click>=8.0",
    "rich>=13.0",
    "tenacity>=8.0",
    "rb-yandex-oauth>=0.3,<0.4",  # на 0.x минорная версия ломающая
]

# Общая OAuth-авторизация Яндекса (keychain + env, автообновление токена) — с GitHub,
# закреплена релизным тегом. Правки одновременно с Директом: `uv pip install -e ../yandex-oauth`
# в venv, без коммита. Переход на новый тег: `tag = "vNEW"` + `uv lock --upgrade-package rb-yandex-oauth`.
[tool.uv.sources]
rb-yandex-oauth = { git = "https://github.com/bolandeu/yandex-oauth", tag = "v0.3.0" }

[project.scripts]
yd = "rb_yandex_direct.cli:main"

[project.urls]
Repository = "https://github.com/bolandeu/yandex-direct"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

[tool.uv]
# Пересобрать editable-установку, когда двигается коммит или тег, — чтобы `--version` следовал тегу.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/rb_yandex_direct"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "syrupy>=4.8",
    "towncrier>=24.8",
    "ty>=0.0.80",
]

# Команды — Click, все в одном файле (не в commands/*.py шаблона): по нему работают
# хуки справки (scripts/check_command_docstrings.py, стандарт §7).
[tool.cli-generator]
commands = "src/rb_yandex_direct/cli.py"

# CHANGELOG из фрагментов: каждое изменение — файл changelog.d/+<slug>.<type>.md
# (`uv run towncrier create +<slug>.<type>.md -c "..."`); scripts/release.py собирает их.
[tool.towncrier]
filename = "CHANGELOG.md"
directory = "changelog.d"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}] - {project_date}"
issue_format = "#{issue}"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing:skip-covered"
# Снапшоты справки лежат в tests/snapshots/help/<command>.txt (стандарт §7), а не в
# `__snapshots__/<test file>/` syrupy — он предупреждает, что «can not relate» файл к тесту.
filterwarnings = ["ignore:(?s).*Can not relate snapshot:UserWarning"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# Порог держим там, где он есть, чтобы новые команды не приезжали без тестов.
# Поднимать можно, опускать — нет.
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S"]
# RUF001-003 — «похожие» unicode-символы: интерфейс на русском, кириллица и
# типографские тире здесь норма, а не опечатка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]  # assert и фиктивные токены — суть тестов
"scripts/*" = ["S603", "S607"]                # subprocess с фиксированным argv (git, uv), без shell

[tool.ruff.lint.flake8-bugbear]
# Стиль Typer `param: T = typer.Option(...)` — вызов в значении по умолчанию намеренно.
extend-immutable-calls = []

[tool.ty.terminal]
error-on-warning = false

# Legacy-код (dict из JSON API без моделей, см. CLAUDE.md «raw-dict подход»): эти правила
# пока предупреждения, а не ошибки. Новый код держим чистым; правило возвращать в error,
# когда предупреждений по нему не останется.
[tool.ty.rules]
invalid-argument-type = "warn"
invalid-assignment = "warn"
not-iterable = "warn"
