[project]
name = "rb-yandex-direct"
version = "0.1.0"
description = "Яндекс.Директ API v5: библиотека, CLI и MCP-сервер"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "mcp[cli]>=1.26.0",
    "click>=8.0",
    "rich>=13.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
rb-yandex-direct = "rb_yandex_direct.cli:main"

[project.entry-points."mcp.servers"]
rb-yandex-direct = "rb_yandex_direct.mcp_server:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rb_yandex_direct"]
